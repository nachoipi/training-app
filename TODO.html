<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitCore — Roadmap de Desarrollo</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222f;
    --border: #2e2e3e;
    --accent: #7c6fff;
    --accent2: #4fc3f7;
    --green: #4caf82;
    --orange: #f5a623;
    --red: #ef5350;
    --text: #e8e8f0;
    --muted: #6b6b82;
    --tag-bg: rgba(124,111,255,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.6; }

  .app { max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }

  header { margin-bottom: 36px; }
  .logo { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; }

  .progress-bar-wrap { margin-top: 16px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width 0.4s; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .day-block { margin-bottom: 24px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .day-header { padding: 14px 20px; background: var(--surface); display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
  .day-header:hover { background: var(--surface2); }
  .day-number { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; min-width: 44px; }
  .day-title { font-weight: 600; flex: 1; }
  .day-tag { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
  .tag-auth    { background: rgba(239,83,80,0.12); color: var(--red); }
  .tag-feature { background: var(--tag-bg); color: var(--accent); }
  .tag-ux      { background: rgba(79,195,247,0.12); color: var(--accent2); }
  .tag-infra   { background: rgba(245,166,35,0.12); color: var(--orange); }
  .tag-perf    { background: rgba(76,175,130,0.12); color: var(--green); }
  .day-done-count { font-size: 11px; color: var(--muted); margin-left: auto; }
  .chevron { color: var(--muted); font-size: 12px; transition: transform 0.2s; }
  .day-block.open .chevron { transform: rotate(90deg); }

  .day-body { border-top: 1px solid var(--border); display: none; }
  .day-block.open .day-body { display: block; }

  .task { display: flex; align-items: flex-start; gap: 12px; padding: 13px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
  .task:last-child { border-bottom: none; }
  .task:hover { background: var(--surface); }

  .checkbox { width: 17px; height: 17px; border: 2px solid var(--border); border-radius: 4px; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .task.done .checkbox { background: var(--green); border-color: var(--green); }
  .task.done .checkbox::after { content: '✓'; font-size: 11px; color: #fff; font-weight: 700; }
  .task.done .task-text { color: var(--muted); text-decoration: line-through; }

  .task-content { flex: 1; }
  .task-text { font-size: 13.5px; }
  .task-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .cat { font-size: 10px; padding: 2px 7px; border-radius: 20px; margin-left: 8px; vertical-align: middle; }
  .cat-be { background: rgba(245,166,35,0.1); color: var(--orange); }
  .cat-fe { background: rgba(79,195,247,0.1); color: var(--accent2); }
  .cat-db { background: rgba(76,175,130,0.1); color: var(--green); }

  .empty-day { padding: 16px 20px; color: var(--muted); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">⚡ FitCore — Roadmap</div>
    <div class="subtitle">Paso a paso del desarrollo · Marcá cada tarea al completarla</div>
    <div class="progress-bar-wrap">
      <div class="progress-label"><span>Progreso total</span><span id="progress-text">0 / 0</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
  </header>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">Todos</button>
    <button class="filter-btn" data-filter="pendiente">Pendientes</button>
    <button class="filter-btn" data-filter="done">Completados</button>
    <button class="filter-btn" data-filter="feature">Feature</button>
    <button class="filter-btn" data-filter="ux">UX</button>
    <button class="filter-btn" data-filter="auth">Auth</button>
    <button class="filter-btn" data-filter="infra">Infra</button>
  </div>

  <div id="days-container"></div>
</div>

      { text: 'Filtros y ordenamiento en la lista de Alumnos', detail: 'Filtrar por adherencia / última sesión / objetivo; ordenar por nombre o actividad', cats: ['fe','be'] },
      { text: 'Acciones rápidas desde la tarjeta de alumno', detail: 'Crear planificación, enviar nota, ver última sesión sin entrar al perfil', cats: ['fe'] },
      { text: 'Vista previa de la rutina desde el perfil del atleta', detail: 'Expandir las rutinas asignadas con sus ejercicios sin abrir un modal', cats: ['fe'] },
      { text: 'Slim down del JWT a { userId, role, exp }', detail: 'Sacar name/email/avatar del token y leerlos siempre desde la DB en cada request. Evita el re-issue del token en updates de perfil y reduce la superficie de claims stale.', cats: ['be'] },
    ]
  },
  {
    day: 'Mejoras',
    title: 'Mejoras a Atleta',
    tag: 'feature',
    tasks: [
      { text: 'Indicador de progreso semanal en "Mi Plan"', detail: 'Mostrar días completados / días planificados en la semana actual', cats: ['fe'] },
      { text: 'Notificaciones in-app cuando el coach asigna planificación', detail: 'Badge en la BottomNav + toast la próxima vez que entre', cats: ['fe','be'] },
      { text: 'Recordatorio del próximo entrenamiento en la home', detail: 'Card destacada con día / ejercicios / botón "Empezar"', cats: ['fe'] },
      { text: 'Histórico personal de PRs por ejercicio', detail: 'Vista con mejores marcas (peso × reps) y gráfico de evolución', cats: ['fe','be'] },
      { text: 'Auto-relleno de la última carga registrada al loguear una sesión', detail: 'Pre-cargar los inputs con la última carga del mismo ejercicio para acelerar el registro', cats: ['fe'] },
    ]
  },
];

const KEY = 'fitcore_todo_v1';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');

function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function taskId(dayIdx, taskIdx) { return `${dayIdx}-${taskIdx}`; }

function isDone(dayIdx, taskIdx) { return !!state[taskId(dayIdx, taskIdx)]; }

function toggle(dayIdx, taskIdx) {
  const id = taskId(dayIdx, taskIdx);
  state[id] = !state[id];
  save();
  render();
}

function updateProgress() {
  let total = 0, done = 0;
  DAYS.forEach((d, di) => d.tasks.forEach((_, ti) => { total++; if (isDone(di, ti)) done++; }));
  document.getElementById('progress-text').textContent = `${done} / ${total}`;
  document.getElementById('progress-fill').style.width = `${total ? (done/total*100) : 0}%`;
}

let activeFilter = 'all';

function render() {
  updateProgress();
  const container = document.getElementById('days-container');
  container.innerHTML = '';

  DAYS.forEach((day, di) => {
    const allDone = day.tasks.every((_, ti) => isDone(di, ti));
    const doneCnt = day.tasks.filter((_, ti) => isDone(di, ti)).length;

    // Filter
    let visibleTasks = day.tasks;
    if (activeFilter === 'pendiente') visibleTasks = day.tasks.filter((_, ti) => !isDone(di, ti));
    else if (activeFilter === 'done') visibleTasks = day.tasks.filter((_, ti) => isDone(di, ti));
    else if (['feature','ux','auth','infra','perf'].includes(activeFilter)) {
      if (day.tag !== activeFilter) return;
    }

    const block = document.createElement('div');
    block.className = 'day-block open';

    const tagLabel = { feature: 'Feature', ux: 'UX', auth: 'Auth & Seguridad', infra: 'Infra', perf: 'Performance' }[day.tag] || day.tag;

    block.innerHTML = `
      <div class="day-header">
        <span class="day-number">${day.day}</span>
        <span class="day-title">${day.title}</span>
        <span class="day-tag tag-${day.tag}">${tagLabel}</span>
        <span class="day-done-count">${doneCnt}/${day.tasks.length}</span>
        <span class="chevron">▶</span>
      </div>
      <div class="day-body"></div>
    `;

    block.querySelector('.day-header').addEventListener('click', () => {
      block.classList.toggle('open');
    });

    const body = block.querySelector('.day-body');

    if (visibleTasks.length === 0) {
      body.innerHTML = '<div class="empty-day">Sin tareas en este filtro.</div>';
    } else {
      day.tasks.forEach((task, ti) => {
        if (activeFilter === 'pendiente' && isDone(di, ti)) return;
        if (activeFilter === 'done' && !isDone(di, ti)) return;

        const catHtml = (task.cats || []).map(c => {
          const labels = { be: 'Backend', fe: 'Frontend', db: 'DB' };
          return `<span class="cat cat-${c}">${labels[c]}</span>`;
        }).join('');

        const row = document.createElement('div');
        row.className = `task${isDone(di, ti) ? ' done' : ''}`;
        row.innerHTML = `
          <div class="checkbox"></div>
          <div class="task-content">
            <div class="task-text">${task.text}${catHtml}</div>
            ${task.detail ? `<div class="task-detail">${task.detail}</div>` : ''}
          </div>
        `;
        row.addEventListener('click', () => toggle(di, ti));
        body.appendChild(row);
      });
    }

    container.appendChild(block);
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});

render();
</script>
</body>
</html>
