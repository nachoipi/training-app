services:
  - type: web
    name: fitcore
    runtime: node
    plan: free
    buildCommand: npm --prefix backend install && npm --prefix frontend install && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: PGSSL
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SUPABASE_VIDEO_BUCKET
        value: exercise-videos
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
