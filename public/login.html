<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitCore — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet" />
  <!-- React 18 + Babel (CDN — para producción compilar con Vite/CRA) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deep:        #0a0b0d;
      --bg-surface:     #111318;
      --bg-card:        #16191f;
      --bg-input:       #1c2028;
      --accent:         #d4f03c;
      --accent-dim:     #a8c12e;
      --accent-glow:    rgba(212,240,60,0.18);
      --text-primary:   #eef0f4;
      --text-secondary: #7c8494;
      --text-muted:     #4a505e;
      --border:         #252b35;
      --border-focus:   #d4f03c;
      --danger:         #f0553c;
      --font-display:   'Barlow Condensed', sans-serif;
      --font-body:      'Barlow', sans-serif;
    }
    html, body { height: 100%; background: var(--bg-deep); color: var(--text-primary); font-family: var(--font-body); font-size: 15px; }
    #root { height: 100%; }

    /* ── Layout ── */
    .layout { display: grid; grid-template-columns: 1fr 480px; min-height: 100vh; }

    /* ── Left panel ── */
    .panel-left {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 3rem;
    }
    .panel-left::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, #0a0b0d 0%, #0f1318 40%, #12191f 100%);
    }
    .panel-left::after {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(212,240,60,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212,240,60,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 60% 40%, black 30%, transparent 100%);
    }
    .hero-content { position: relative; z-index: 2; }
    .brand-tag {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent-glow);
      border: 1px solid rgba(212,240,60,0.3);
      border-radius: 2px; padding: 6px 14px; margin-bottom: 2rem;
    }
    .brand-tag span {
      font-family: var(--font-display); font-size: 11px;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent); font-weight: 600;
    }
    .brand-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(56px,7vw,88px);
      font-weight: 800; line-height: 0.92;
      letter-spacing: -0.01em; text-transform: uppercase;
      color: var(--text-primary); margin-bottom: 1.5rem;
    }
    .hero-title em { font-style: normal; color: var(--accent); }
    .hero-sub {
      font-size: 14px; color: var(--text-secondary);
      font-weight: 300; line-height: 1.6;
      max-width: 360px; margin-bottom: 3rem;
    }
    .stats-row { display: flex; gap: 2rem; }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat-value {
      font-family: var(--font-display); font-size: 28px;
      font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em;
    }
    .stat-label {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--text-muted); font-weight: 400;
    }
    .stat-divider { width: 1px; background: var(--border); align-self: stretch; }

    .deco-ring {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(212,240,60,0.07); pointer-events: none;
    }

    /* ── Right panel ── */
    .panel-right {
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column; justify-content: center;
      padding: 3rem 3.5rem; position: relative; overflow-y: auto;
    }
    .panel-right::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.6;
    }

    /* ── Login header ── */
    .login-header { margin-bottom: 2rem; }
    .login-label {
      font-family: var(--font-display); font-size: 11px;
      letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--accent); font-weight: 600;
      margin-bottom: 0.75rem; display: block;
    }
    .login-title {
      font-family: var(--font-display); font-size: 38px;
      font-weight: 700; text-transform: uppercase;
      line-height: 1; letter-spacing: 0.01em; color: var(--text-primary);
    }
    .login-title .muted { color: var(--text-secondary); font-weight: 300; }

    /* ── Role tabs ── */
    .role-tabs {
      display: flex; gap: 0; margin-bottom: 1.75rem;
      border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
    }
    .role-tab {
      flex: 1; padding: 10px 8px;
      font-family: var(--font-display); font-size: 13px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      background: transparent; border: none; cursor: pointer;
      color: var(--text-muted); transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .role-tab.active {
      background: var(--accent-glow);
      color: var(--accent); border-bottom: 2px solid var(--accent);
    }
    .role-tab:not(.active):hover { color: var(--text-secondary); background: rgba(255,255,255,0.03); }

    /* ── Form ── */
    .form-group { margin-bottom: 1.25rem; }
    .form-label {
      display: block; font-size: 11px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-muted);
      font-weight: 500; margin-bottom: 0.5rem;
    }
    .input-wrapper { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none; transition: color 0.2s;
    }
    .input-wrapper:focus-within .input-icon { color: var(--accent); }
    .form-input {
      width: 100%; background: var(--bg-input);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 13px 14px 13px 42px;
      color: var(--text-primary); font-family: var(--font-body);
      font-size: 14px; font-weight: 400;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none; -webkit-appearance: none;
    }
    .form-input::placeholder { color: var(--text-muted); }
    .form-input:focus { border-color: var(--border-focus); background: #1e2330; box-shadow: 0 0 0 3px var(--accent-glow); }
    .form-input.has-error { border-color: var(--danger); }

    .toggle-pass {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 4px; transition: color 0.2s;
    }
    .toggle-pass:hover { color: var(--text-secondary); }

    .form-extras {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.75rem; margin-top: 0.25rem;
    }
    .checkbox-label {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
      font-size: 13px; color: var(--text-secondary); user-select: none;
    }
    .checkbox-label input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
    .forgot-link { font-size: 13px; color: var(--text-secondary); text-decoration: none; transition: color 0.2s; }
    .forgot-link:hover { color: var(--accent); }

    /* ── Error msg ── */
    .error-msg {
      background: rgba(240,85,60,0.1); border: 1px solid rgba(240,85,60,0.3);
      border-radius: 4px; padding: 10px 14px;
      font-size: 13px; color: #f0553c;
      margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: 8px;
      animation: fadeUp 0.2s ease;
    }

    /* ── Hint box ── */
    .hint-box {
      background: rgba(212,240,60,0.06); border: 1px solid rgba(212,240,60,0.18);
      border-radius: 4px; padding: 10px 14px;
      font-size: 12px; color: var(--accent-dim);
      margin-bottom: 1.25rem; line-height: 1.6;
    }
    .hint-box strong { color: var(--accent); }

    /* ── CTA button ── */
    .btn-login {
      width: 100%; background: var(--accent);
      border: none; border-radius: 4px; padding: 15px;
      font-family: var(--font-display); font-size: 16px;
      font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      color: #0a0b0d; cursor: pointer;
      transition: background 0.2s, transform 0.12s, box-shadow 0.2s;
      position: relative; overflow: hidden; min-height: 52px;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-login::before {
      content: ''; position: absolute; top: 0; left: -100%;
      width: 60%; height: 100%;
      background: rgba(255,255,255,0.2); transform: skewX(-20deg);
      transition: left 0.4s;
    }
    .btn-login:hover { background: #c8e030; box-shadow: 0 0 30px rgba(212,240,60,0.35); }
    .btn-login:hover::before { left: 160%; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { pointer-events: none; opacity: 0.8; }
    .btn-login.success { background: #3dbb6f; cursor: default; }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(10,11,13,0.3); border-top-color: #0a0b0d;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider ── */
    .divider { display: flex; align-items: center; gap: 12px; margin: 1.75rem 0; }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }

    /* ── SSO ── */
    .btn-sso {
      width: 100%; background: transparent;
      border: 1px solid var(--border); border-radius: 4px; padding: 12px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-family: var(--font-body); font-size: 13px;
      color: var(--text-secondary); cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .btn-sso:hover { border-color: var(--text-muted); color: var(--text-primary); background: var(--bg-card); }

    /* ── Footer ── */
    .login-footer {
      margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-text { font-size: 12px; color: var(--text-muted); }
    .footer-role {
      display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
      background: rgba(212,240,60,0.08); border: 1px solid rgba(212,240,60,0.2);
      border-radius: 2px; padding: 4px 10px;
      color: var(--accent-dim); font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      font-family: var(--font-display);
    }

    /* ── Animations ── */
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeUp 0.4s ease forwards; }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .panel-left { display: none; }
      .panel-right { min-height: 100vh; padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ---- SVG Icons ----
const IconMail = () => (
  <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8">
    <path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
  </svg>
);
const IconLock = () => (
  <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8">
    <rect x="3" y="11" width="18" height="11" rx="2"/>
    <path strokeLinecap="round" d="M7 11V7a5 5 0 0110 0v4"/>
  </svg>
);
const IconEye = () => (
  <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8">
    <path strokeLinecap="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
    <path strokeLinecap="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
  </svg>
);
const IconEyeOff = () => (
  <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8">
    <path strokeLinecap="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
  </svg>
);
const IconAlert = () => (
  <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" y1="8" x2="12" y2="12"/>
    <line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>
);
const IconUser = () => (
  <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
    <circle cx="12" cy="8" r="4"/>
    <path d="M12 14c-6 0-8 3-8 4h16c0-1-2-4-8-4z"/>
  </svg>
);
const IconGoogle = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
  </svg>
);

// ---- Demo hints per role ----
const DEMO_HINTS = {
  trainer: { email: 'trainer@fitcore.com', label: 'Entrenador' },
  athlete: { email: 'nacho@fitcore.com',   label: 'Atleta' },
};

// ============================================================
// LOGIN PAGE COMPONENT
// ============================================================
function LoginPage() {
  const [role,     setRole]     = useState('trainer');
  const [email,    setEmail]    = useState('');
  const [password, setPassword] = useState('');
  const [remember, setRemember] = useState(false);
  const [showPass, setShowPass] = useState(false);
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState('');
  const [success,  setSuccess]  = useState(false);

  // Si ya hay sesión activa, redirigir
  useEffect(() => {
    const token = localStorage.getItem('fitcore_token');
    if (!token) return;
    try {
      const payload = JSON.parse(atob(token));
      if (payload.exp > Date.now()) {
        window.location.href = '/';
      } else {
        localStorage.removeItem('fitcore_token');
        localStorage.removeItem('fitcore_user');
      }
    } catch { localStorage.removeItem('fitcore_token'); }
  }, []);

  const hint = DEMO_HINTS[role];

  function validate() {
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setError('Ingresá un email válido.');
      return false;
    }
    if (!password || password.length < 6) {
      setError('La contraseña debe tener al menos 6 caracteres.');
      return false;
    }
    return true;
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setError('');
    if (!validate()) return;

    setLoading(true);
    try {
      const res  = await fetch('/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email: email.trim(), password }),
      });
      const data = await res.json();

      if (!res.ok) {
        setError(data.error || 'Credenciales incorrectas.');
        return;
      }

      // Guardar sesión
      localStorage.setItem('fitcore_token', data.token);
      localStorage.setItem('fitcore_user',  JSON.stringify(data.user));

      setSuccess(true);
      setTimeout(() => { window.location.href = '/'; }, 900);
    } catch {
      setError('Error de conexión. Verificá que el servidor esté corriendo.');
    } finally {
      setLoading(false);
    }
  }

  function fillDemo() {
    setEmail(hint.email);
    setPassword('123456');
    setError('');
  }

  return (
    <div className="layout">

      {/* ── LEFT: Hero ── */}
      <div className="panel-left">
        <div className="deco-ring" style={{width:'500px',height:'500px',top:'-120px',right:'-200px'}}/>
        <div className="deco-ring" style={{width:'300px',height:'300px',top:'-40px',right:'-80px',borderColor:'rgba(212,240,60,0.12)'}}/>
        <div className="deco-ring" style={{width:'180px',height:'180px',top:'60px',right:'20px',borderColor:'rgba(212,240,60,0.18)'}}/>
        <div className="hero-content">
          <div className="brand-tag">
            <div className="brand-dot"/>
            <span>{role === 'trainer' ? 'Personal Trainer Portal' : 'Athlete Portal'}</span>
          </div>
          <h1 className="hero-title">
            Fit<em>Core</em><br/>Pro
          </h1>
          <p className="hero-sub">
            {role === 'trainer'
              ? 'Diseñá planes, monitoreá el progreso de tus alumnos y gestioná tu práctica profesional desde un solo lugar.'
              : 'Seguí tus rutinas, registrá cada sesión y visualizá tu progreso en tiempo real.'}
          </p>
          <div className="stats-row">
            <div className="stat">
              <span className="stat-value">2.4k</span>
              <span className="stat-label">Entrenadores activos</span>
            </div>
            <div className="stat-divider"/>
            <div className="stat">
              <span className="stat-value">18k</span>
              <span className="stat-label">Alumnos registrados</span>
            </div>
            <div className="stat-divider"/>
            <div className="stat">
              <span className="stat-value">340k</span>
              <span className="stat-label">Entrenamientos completados</span>
            </div>
          </div>
        </div>
      </div>

      {/* ── RIGHT: Login form ── */}
      <div className="panel-right">

        <div className="login-header fade-in">
          <span className="login-label">Acceso</span>
          <h2 className="login-title">
            Hola,<br/>
            <span className="muted">{role === 'trainer' ? 'Entrenador' : 'Atleta'}</span>
          </h2>
        </div>

        {/* Role tabs */}
        <div className="role-tabs fade-in">
          <button
            type="button"
            className={`role-tab${role === 'trainer' ? ' active' : ''}`}
            onClick={() => { setRole('trainer'); setError(''); setEmail(''); setPassword(''); }}
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            Entrenador
          </button>
          <button
            type="button"
            className={`role-tab${role === 'athlete' ? ' active' : ''}`}
            onClick={() => { setRole('athlete'); setError(''); setEmail(''); setPassword(''); }}
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="8" r="4"/>
              <path d="M12 14c-6 0-8 3-8 4h16c0-1-2-4-8-4z"/>
            </svg>
            Atleta
          </button>
        </div>

        {/* Demo hint */}
        <div className="hint-box fade-in">
          Demo: <strong>{hint.email}</strong> / <strong>123456</strong>
          {' — '}
          <span
            style={{color:'var(--accent)',cursor:'pointer',textDecoration:'underline'}}
            onClick={fillDemo}
          >Autocompletar</span>
        </div>

        {/* Error */}
        {error && (
          <div className="error-msg">
            <IconAlert/> <span>{error}</span>
          </div>
        )}

        <form onSubmit={handleSubmit} noValidate>
          {/* Email */}
          <div className="form-group">
            <label className="form-label" htmlFor="email">
              {role === 'trainer' ? 'Email profesional' : 'Email'}
            </label>
            <div className="input-wrapper">
              <span className="input-icon"><IconMail/></span>
              <input
                className={`form-input${error ? ' has-error' : ''}`}
                type="email" id="email" autoComplete="email"
                placeholder="tu@correo.com"
                value={email}
                onChange={e => { setEmail(e.target.value); setError(''); }}
              />
            </div>
          </div>

          {/* Password */}
          <div className="form-group">
            <label className="form-label" htmlFor="password">Contraseña</label>
            <div className="input-wrapper">
              <span className="input-icon"><IconLock/></span>
              <input
                className={`form-input${error ? ' has-error' : ''}`}
                type={showPass ? 'text' : 'password'} id="password"
                autoComplete="current-password" placeholder="••••••••"
                value={password}
                onChange={e => { setPassword(e.target.value); setError(''); }}
              />
              <button type="button" className="toggle-pass" onClick={() => setShowPass(s => !s)} aria-label="Mostrar contraseña">
                {showPass ? <IconEyeOff/> : <IconEye/>}
              </button>
            </div>
          </div>

          <div className="form-extras">
            <label className="checkbox-label">
              <input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)}/>
              Recordarme
            </label>
            <a href="#" className="forgot-link">¿Olvidaste tu contraseña?</a>
          </div>

          <button
            type="submit"
            className={`btn-login${success ? ' success' : ''}`}
            disabled={loading || success}
          >
            {success
              ? '✓ Acceso concedido'
              : loading
                ? <span className="spinner"/>
                : 'Ingresar al panel'}
          </button>
        </form>

        <div className="divider">
          <div className="divider-line"/>
          <span className="divider-text">o continuar con</span>
          <div className="divider-line"/>
        </div>

        <button className="btn-sso" type="button">
          <IconGoogle/> Continuar con Google
        </button>

        <div className="login-footer">
          <span className="footer-text">© 2025 FitCore Pro</span>
          <span className="footer-role">
            <IconUser/>
            {role === 'trainer' ? 'Entrenador' : 'Atleta'}
          </span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LoginPage/>);
</script>
</body>
</html>
